---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: costum-os
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: quay.io/fedora-ostree-desktops/cosmic-atomic
image-version: 44 # You can pin to a specific version of Fedora as well

# module configuration, executed in order
# you can include multiple instances of the same module
modules:

  - type: script # let the CachyOS kernel load its own kernel modules under SELinux enforcing
    snippets:
      - "setsebool -P domain_kernel_load_modules on"

  - type: dnf # swap the stock kernel for the CachyOS kernel (https://copr.fedorainfracloud.org/coprs/bieszczaders/kernel-cachyos/)
    repos:
      cleanup: true # drop the COPR repos again once the packages below are installed
      copr:
        - bieszczaders/kernel-cachyos
        - bieszczaders/kernel-cachyos-addons # provides scx-scheds/scx-tools (https://copr.fedorainfracloud.org/coprs/bieszczaders/kernel-cachyos-addons/)

    install:
      packages:
        - kernel-cachyos
        - scx-scheds
        - scx-tools

    remove:
      packages:
        - kernel
        - kernel-core
        - kernel-modules
        - kernel-modules-core
        - kernel-modules-extra

  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: brew
    auto-update: true
    auto-upgrade: true

  - type: dnf
    install:
      packages:
        - zsh

    remove:
      packages:
        # example: removing firefox (in favor of the flatpak)
        # "firefox" is the main package, "firefox-langpacks" is a dependency
        - default-editor
        - system-default-editor
        - nano-default-editor
        - nano
        - firefox-langpacks # also remove firefox dependency (not required for all packages, this is a special case)
        - firefox
        - toolbox


  - type: signing # this sets up the proper policy & signing files for signed images to work fully
